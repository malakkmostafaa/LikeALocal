name: like_a_local
description: Experience cities like a local
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_markdown: ^0.7.3
  googleapis_auth: ^1.6.0

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_messaging: ^16.2.0

  # UI
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.9

  # Location
  geolocator: ^14.0.2
  native_geofence: ^1.2.2
  permission_handler: ^11.3.1
  geocoding: ^4.0.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  google_maps_flutter: ^2.17.0

  # Image Handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  path_provider: ^2.1.2
  path: ^1.8.3

  # Local Storage
  shared_preferences: ^2.2.2

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.3.3
  connectivity_plus: ^7.1.1

  # AI
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^5.1.0
  video_player: ^2.11.1
  url_launcher: ^6.3.2
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/service_account.json
  # assets:
  #   - assets/images/
  #   - assets/icons/
