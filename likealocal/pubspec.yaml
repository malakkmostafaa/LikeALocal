name: like_a_local
description: Experience cities like a local
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Location
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.3

  # Image Handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Local Storage
  shared_preferences: ^2.2.2

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
